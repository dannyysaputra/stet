<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Stet: review</title>
<link rel="stylesheet" href="/src/base.css">
<link rel="stylesheet" href="/src/review/review.css">
</head>
<body>
<header class="seam-bar">
  <a class="brand" href="/">Stet</a>
  <span id="left-count" class="left-count" data-zero="true" aria-live="polite">Left this laptop: 0</span>
</header>
<div class="review">
  <section class="stage" aria-label="App under review">
    <iframe id="app" src="/sample/" title="Sample app under review"></iframe>
    <div id="pins" class="pins"></div>
  </section>
  <aside class="panel">
    <section class="area" aria-labelledby="laptop-title">
      <p id="laptop-title" class="area-title">On this laptop</p>
      <h1>Review</h1>
      <p id="summary" class="dim">Loading the app...</p>
      <div class="row">
        <button id="review" type="button" disabled>Review this screen</button>
        <button id="stop" type="button" class="quiet" hidden>Stop</button>
      </div>
      <p id="progress" class="dim" aria-live="polite"></p>
      <p id="warm" class="dim"></p>

      <details id="guide-box" class="guide-box">
        <summary>Wording guide: <span id="guide-name">starter guide</span></summary>
        <label for="brief">Voice brief, two lines. Only these two lines are sent to the cloud.</label>
        <textarea id="brief" rows="3" maxlength="300" placeholder="Invoicing for small shops; owners bill customers between other jobs. We call them clients.&#10;Calm, plain and a little warm. Never salesy."></textarea>
        <div class="row"><button id="write-guide" type="button">Write the guide in the cloud</button></div>
        <p id="brief-status" class="dim" aria-live="polite"></p>
        <label for="guide-text">The guide the laptop model checks against</label>
        <textarea id="guide-text" rows="14" spellcheck="false"></textarea>
        <p id="guide-size" class="dim"></p>
        <div class="row">
          <button id="save-guide" type="button" class="quiet">Save edits</button>
          <button id="reset-guide" type="button" class="quiet">Back to the starter guide</button>
        </div>
        <p id="guide-status" class="dim" aria-live="polite"></p>
      </details>

      <h2>Findings <span id="findings-count" class="dim"></span></h2>
      <p class="dim">Ticked findings go into the fix prompt.</p>
      <ol id="findings"></ol>
      <div class="row"><button id="make-fix" type="button" disabled>Make fix prompt</button></div>
      <p id="fix-status" class="dim" aria-live="polite"></p>
      <label for="fix-prompt" id="fix-label" class="fix-label" hidden>Fix prompt for your coding agent (you can edit it)</label>
      <textarea id="fix-prompt" rows="10" spellcheck="false" hidden></textarea>
      <div class="row" id="fix-actions" hidden>
        <button id="copy-fix" type="button" class="quiet">Copy</button>
        <span id="copy-status" class="dim" aria-live="polite"></span>
      </div>

      <details class="all-text">
        <summary>All text on this screen (<span id="text-count">0</span>)</summary>
        <ol id="strings"></ol>
      </details>
    </section>

    <section class="area cloud" aria-labelledby="cloud-title">
      <p id="cloud-title" class="area-title">Sent to the cloud</p>
      <ol id="sent"></ol>
      <p id="sent-none" class="dim">Nothing from this page has been sent to a cloud model.</p>
      <p id="net" class="dim"></p>
    </section>
  </aside>
</div>
<script type="module" src="/src/review/review.js"></script>
</body>
</html>
